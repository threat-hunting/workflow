# P-B17 · lvl-b · topic hitl-int · role=gate
# Naming: docs/15-b17-product-test/01-naming-standard.md
# Methods: M1 manual · M2 webhook · M3 case-comment select-workflow (TRIGGER.comment)
# Case-trigger config panel: intentionally OFF
type: workflow
id: wf_b17LvlBHitlIntGate
alias: b17-lvl-b-hitl-int-gate
definition:
  title: "b17 · lvl-b · hitl-int · gate · needs-trigger"
  description: >
    P-B17 product-test artifact.
    Level: lvl-b (machine + human). Topic: T-HITL-INT. Role: gate (decision).
    RUN MODE: needs-trigger — bare Manual Run without decision+case_id (or
    comment→select-workflow) WILL FAIL; expected. Title suffix «needs-trigger».
    Accepts TRIGGER.decision+case_id (M1/M2) or case-comment payload (M3:
    TRIGGER.comment / TRIGGER.text + case_id). Tag strategy: remove hitl-int-pending;
    keep b17+lvl-b+topic-hitl-int; add hitl-int-approved|denied and hitl-int-via-*.
    Writes audit comment with actor_id/via. Sensitive reshape only on approve.
    Org: B17 Lab · Workspace: b17-hitl-int · External deps: none.
  entrypoint:
    ref: normalize
    expects: {}
  actions:
    - ref: normalize
      action: core.script.run_python
      args:
        allow_network: false
        timeout_seconds: 30
        inputs:
          decision: ${{ TRIGGER.decision }}
          case_id: ${{ TRIGGER.case_id }}
          comment: ${{ TRIGGER.comment }}
          text: ${{ TRIGGER.text }}
          triggered_by: ${{ TRIGGER.triggered_by }}
          event: ${{ TRIGGER.event }}
        script: |
          def main(decision, case_id, comment, text, triggered_by, event):
              raw = ""
              source = "empty"
              for label, val in (
                  ("decision", decision),
                  ("comment", comment),
                  ("text", text),
              ):
                  if val is None:
                      continue
                  s = str(val).strip()
                  if s:
                      raw = s
                      source = label
                      break
              token = raw.split()[0].lower() if raw else ""
              if token in ("approve", "approved", "yes", "ok"):
                  d = "approve"
              elif token in ("deny", "denied", "reject", "no"):
                  d = "deny"
              else:
                  d = "invalid"

              actor_type = "unknown"
              actor_id = ""
              if isinstance(triggered_by, dict):
                  actor_type = str(triggered_by.get("type") or "unknown")
                  actor_id = str(
                      triggered_by.get("user_id")
                      or triggered_by.get("service_id")
                      or ""
                  )
              if isinstance(event, dict) and not actor_id and event.get("user_id"):
                  actor_id = str(event["user_id"])
                  if actor_type == "unknown":
                      actor_type = "user"

              via = "case-comment" if source in ("comment", "text") else (
                  "manual-or-webhook" if source == "decision" else "unknown"
              )
              via_tag = (
                  "hitl-int-via-comment" if via == "case-comment" else "hitl-int-via-api"
              )
              result_tag = (
                  "hitl-int-approved" if d == "approve"
                  else "hitl-int-denied" if d == "deny"
                  else "hitl-int-invalid"
              )
              audit = (
                  f"P-B17 T-HITL-INT DECISION={d} via={via} "
                  f"actor_type={actor_type} actor_id={actor_id or '-'} raw={raw!r}"
              )
              desc = f"P-B17 hitl-int {d.upper()} via={via} actor_id={actor_id or '-'}"
              return {
                  "decision": d,
                  "case_id": str(case_id or "").strip(),
                  "raw": raw,
                  "source": source,
                  "via": via,
                  "via_tag": via_tag,
                  "result_tag": result_tag,
                  "actor_type": actor_type,
                  "actor_id": actor_id,
                  "audit": audit,
                  "desc": desc,
              }
    - ref: require_valid
      action: core.require
      depends_on: [normalize]
      args:
        conditions: ${{ FN.contains(ACTIONS.normalize.result.decision, ["approve", "deny"]) }}
        require_all: true
        raise_error: true
    - ref: require_case
      action: core.require
      depends_on: [normalize, require_valid]
      args:
        conditions: ${{ FN.length(ACTIONS.normalize.result.case_id) > 0 }}
        require_all: true
        raise_error: true
    # remove_case_tag returns HTTP 500 if the tag is already absent (product quirk).
    # Recover via .error edge so re-running Gate / double-approve does not fail the pack.
    - ref: drop_pending
      action: core.cases.remove_case_tag
      depends_on: [require_case]
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        tag: hitl-int-pending
    - ref: drop_pending_ok
      action: core.transform.reshape
      depends_on: [drop_pending]
      args:
        value: { pending_removed: true }
    - ref: drop_pending_missing
      action: core.transform.reshape
      depends_on: [drop_pending.error]
      args:
        value: { pending_removed: false, note: "tag already absent or remove_case_tag 500" }
    - ref: after_drop
      action: core.transform.reshape
      depends_on: [drop_pending_ok, drop_pending_missing]
      join_strategy: any
      args:
        value: { drop_stage: done }
    - ref: ensure_b17
      action: core.cases.add_case_tag
      depends_on: [require_case]
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        tag: b17
        create_if_missing: true
    - ref: ensure_lvl
      action: core.cases.add_case_tag
      depends_on: [require_case]
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        tag: lvl-b
        create_if_missing: true
    - ref: ensure_topic
      action: core.cases.add_case_tag
      depends_on: [require_case]
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        tag: topic-hitl-int
        create_if_missing: true
    - ref: add_result_tag
      action: core.cases.add_case_tag
      depends_on: [after_drop, ensure_b17, ensure_lvl, ensure_topic]
      join_strategy: all
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        tag: ${{ ACTIONS.normalize.result.result_tag }}
        create_if_missing: true
    - ref: add_via_tag
      action: core.cases.add_case_tag
      depends_on: [ensure_topic]
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        tag: ${{ ACTIONS.normalize.result.via_tag }}
        create_if_missing: true
    - ref: on_approve
      action: core.cases.update_case
      depends_on: [add_result_tag, add_via_tag]
      join_strategy: all
      run_if: ${{ FN.is_equal(ACTIONS.normalize.result.decision, "approve") }}
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        status: in_progress
        description: ${{ ACTIONS.normalize.result.desc }}
    - ref: sensitive
      action: core.transform.reshape
      depends_on: [on_approve]
      run_if: ${{ FN.is_equal(ACTIONS.normalize.result.decision, "approve") }}
      args:
        value:
          executed: true
          action: sensitive-lab-step
          plan: P-B17
          level: lvl-b
          topic: hitl-int
          case_id: ${{ ACTIONS.normalize.result.case_id }}
          via: ${{ ACTIONS.normalize.result.via }}
          actor_id: ${{ ACTIONS.normalize.result.actor_id }}
    - ref: on_deny
      action: core.cases.update_case
      depends_on: [add_result_tag, add_via_tag]
      join_strategy: all
      run_if: ${{ FN.is_equal(ACTIONS.normalize.result.decision, "deny") }}
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        status: closed
        description: ${{ ACTIONS.normalize.result.desc }}
    - ref: audit_comment
      action: core.cases.create_comment
      depends_on: [on_approve, on_deny, sensitive]
      join_strategy: any
      args:
        case_id: ${{ ACTIONS.normalize.result.case_id }}
        content: ${{ ACTIONS.normalize.result.audit }}
    - ref: pack
      action: core.transform.reshape
      depends_on: [audit_comment]
      args:
        value:
          plan: P-B17
          level: lvl-b
          topic: hitl-int
          role: gate
          decision: ${{ ACTIONS.normalize.result.decision }}
          case_id: ${{ ACTIONS.normalize.result.case_id }}
          via: ${{ ACTIONS.normalize.result.via }}
          actor_id: ${{ ACTIONS.normalize.result.actor_id }}
          result_tag: ${{ ACTIONS.normalize.result.result_tag }}
          via_tag: ${{ ACTIONS.normalize.result.via_tag }}
          approved_executed: ${{ FN.is_equal(ACTIONS.normalize.result.decision, "approve") }}
  returns: ${{ ACTIONS.pack.result }}
layout:
  trigger: { x: 0, y: 0 }
  actions:
    - { ref: normalize, x: 0, y: 120 }
    - { ref: require_valid, x: 0, y: 240 }
    - { ref: require_case, x: 0, y: 360 }
    - { ref: drop_pending, x: -280, y: 480 }
    - { ref: drop_pending_ok, x: -360, y: 600 }
    - { ref: drop_pending_missing, x: -200, y: 600 }
    - { ref: after_drop, x: -280, y: 720 }
    - { ref: ensure_b17, x: -40, y: 480 }
    - { ref: ensure_lvl, x: 120, y: 480 }
    - { ref: ensure_topic, x: 280, y: 480 }
    - { ref: add_result_tag, x: -80, y: 840 }
    - { ref: add_via_tag, x: 160, y: 720 }
    - { ref: on_approve, x: -160, y: 960 }
    - { ref: sensitive, x: -160, y: 1080 }
    - { ref: on_deny, x: 160, y: 960 }
    - { ref: audit_comment, x: 0, y: 1200 }
    - { ref: pack, x: 0, y: 1320 }
