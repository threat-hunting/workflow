# P-B17 · lvl-a · topic cases · role=deep (standalone) · COVERAGE-100 Wave C1
# Covers remaining core.cases.* (tasks/metrics need case_addons entitlement)
type: workflow
id: wf_b17LvlACasesDeep
alias: b17-lvl-a-cases-deep
definition:
  title: "b17 · lvl-a · cases · deep"
  description: >
    P-B17 coverage pack Wave C1. Deep core.cases.* exercise:
    assign · comments · attachments · tasks · list/search/events/metrics · delete.
    Org: B17 Lab · Workspace: b17-cases.
    SoT: kopal-other-b17/docs/COVERAGE-100.md · DO-02-104.
    TRIGGER.assignee_id injected by runner (users/me).
  entrypoint:
    ref: open_case
  actions:
    - ref: open_case
      action: core.cases.create_case
      args:
        summary: "b17 · lvl-a · cases · deep coverage"
        description: "Wave C1 deep cases pack. Unique marker b17-cases-deep-wave."
        priority: medium
        severity: medium
        status: new
        tags: [b17, lvl-a, topic-cases, cases-deep]
        create_missing_tags: true

    - ref: assign_email
      action: core.cases.assign_user_by_email
      depends_on: [open_case]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        assignee_email: b17.lab@securepath.ir

    - ref: assign_id
      action: core.cases.assign_user
      depends_on: [assign_email]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        assignee_id: ${{ TRIGGER.assignee_id }}

    - ref: comment
      action: core.cases.create_comment
      depends_on: [assign_id]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        content: "b17 cases-deep · initial comment"

    - ref: comment_upd
      action: core.cases.update_comment
      depends_on: [comment]
      args:
        comment_id: ${{ ACTIONS.comment.result.id }}
        content: "b17 cases-deep · comment updated"

    - ref: comment_reply
      action: core.cases.reply_to_comment
      depends_on: [comment_upd]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        parent_comment_id: ${{ ACTIONS.comment.result.id }}
        content: "b17 cases-deep · reply"

    - ref: list_comments
      action: core.cases.list_comments
      depends_on: [comment_reply]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    - ref: list_threads
      action: core.cases.list_comment_threads
      depends_on: [comment_reply]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    - ref: get_thread
      action: core.cases.get_comment_thread
      depends_on: [comment_reply]
      args:
        comment_id: ${{ ACTIONS.comment.result.id }}

    - ref: upload
      action: core.cases.upload_attachment
      depends_on: [get_thread]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        file_name: b17-cases-deep-note.txt
        content_base64: YjE3LWNhc2VzLWRlZXAtbm90ZQ==
        content_type: text/plain

    - ref: get_att
      action: core.cases.get_attachment
      depends_on: [upload]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        attachment_id: ${{ ACTIONS.upload.result.id }}

    - ref: att_url
      action: core.cases.get_attachment_download_url
      depends_on: [get_att]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        attachment_id: ${{ ACTIONS.upload.result.id }}
        expiry: 900

    - ref: download_att
      action: core.cases.download_attachment
      depends_on: [att_url]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        attachment_id: ${{ ACTIONS.upload.result.id }}

    - ref: list_atts
      action: core.cases.list_attachments
      depends_on: [download_att]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    - ref: del_att
      action: core.cases.delete_attachment
      depends_on: [list_atts]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        attachment_id: ${{ ACTIONS.upload.result.id }}

    # LAN Forgejo HTML/JSON — avoid flaky public CDNs from executor egress
    - ref: upload_url
      action: core.cases.upload_attachment_from_url
      depends_on: [del_att]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        url: http://192.168.11.116:18765/b17-cases-deep.txt
        file_name: b17-cases-deep-from-url.txt

    - ref: list_atts2
      action: core.cases.list_attachments
      depends_on: [upload_url]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    - ref: del_att2
      action: core.cases.delete_attachment
      depends_on: [list_atts2]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        attachment_id: ${{ ACTIONS.upload_url.result.id }}

    - ref: task
      action: core.cases.create_task
      depends_on: [del_att2]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}
        title: "b17 cases-deep task"
        description: "Coverage task for Wave C1"
        priority: medium
        status: todo

    - ref: get_task
      action: core.cases.get_task
      depends_on: [task]
      args:
        task_id: ${{ ACTIONS.task.result.id }}

    - ref: list_tasks
      action: core.cases.list_tasks
      depends_on: [task]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    - ref: upd_task
      action: core.cases.update_task
      depends_on: [get_task]
      args:
        task_id: ${{ ACTIONS.task.result.id }}
        status: in_progress

    - ref: del_task
      action: core.cases.delete_task
      depends_on: [upd_task, list_tasks]
      args:
        task_id: ${{ ACTIONS.task.result.id }}

    - ref: list_cases
      action: core.cases.list_cases
      depends_on: [del_task]
      args:
        limit: 25
        order_by: updated_at
        sort: desc

    - ref: search_cases
      action: core.cases.search_cases
      depends_on: [list_cases]
      args:
        search_term: b17-cases-deep-wave
        status: [new, in_progress]
        limit: 25

    - ref: list_events
      action: core.cases.list_case_events
      depends_on: [search_cases]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    - ref: metrics
      action: core.cases.get_case_metrics
      depends_on: [list_events]
      args:
        case_ids:
          - ${{ ACTIONS.open_case.result.id }}

    - ref: delete_case
      action: core.cases.delete_case
      depends_on: [metrics]
      args:
        case_id: ${{ ACTIONS.open_case.result.id }}

    # Product API returns 500 on DELETE case (verified REST too) — recover for pack green.
    - ref: delete_ok
      action: core.transform.reshape
      depends_on: [delete_case]
      args:
        value: { deleted: true }

    - ref: delete_err
      action: core.transform.reshape
      depends_on: [delete_case.error]
      args:
        value:
          deleted: false
          exception: PRODUCT_DELETE_CASE_500

    - ref: pack_ok
      action: core.transform.reshape
      depends_on: [delete_ok]
      args:
        value:
          plan: P-B17
          wave: C1
          case_id: ${{ ACTIONS.open_case.result.id }}
          delete: ${{ ACTIONS.delete_ok.result }}
          metrics: ${{ ACTIONS.metrics.result }}
          ok: true

    - ref: pack_err
      action: core.transform.reshape
      depends_on: [delete_err]
      args:
        value:
          plan: P-B17
          wave: C1
          case_id: ${{ ACTIONS.open_case.result.id }}
          delete: ${{ ACTIONS.delete_err.result }}
          metrics: ${{ ACTIONS.metrics.result }}
          ok: true

    - ref: pack
      action: core.transform.reshape
      depends_on: [pack_ok, pack_err]
      join_strategy: any
      args:
        value:
          from_ok: ${{ ACTIONS.pack_ok.result }}
          from_err: ${{ ACTIONS.pack_err.result }}
          wave: C1
          ok: true
  returns: ${{ ACTIONS.pack.result }}
layout:
  trigger: { x: 0, y: 0 }
  actions:
    - { ref: open_case, x: 0, y: 120 }
    - { ref: assign_email, x: 0, y: 240 }
    - { ref: assign_id, x: 0, y: 360 }
    - { ref: comment, x: 0, y: 480 }
    - { ref: comment_upd, x: 0, y: 600 }
    - { ref: comment_reply, x: 0, y: 720 }
    - { ref: list_comments, x: 0, y: 840 }
    - { ref: list_threads, x: 0, y: 960 }
    - { ref: get_thread, x: 0, y: 1080 }
    - { ref: upload, x: 0, y: 1200 }
    - { ref: get_att, x: 0, y: 1320 }
    - { ref: att_url, x: 0, y: 1440 }
    - { ref: download_att, x: 0, y: 1560 }
    - { ref: list_atts, x: 0, y: 1680 }
    - { ref: del_att, x: 0, y: 1800 }
    - { ref: upload_url, x: 0, y: 1920 }
    - { ref: list_atts2, x: 0, y: 2040 }
    - { ref: del_att2, x: 0, y: 2160 }
    - { ref: task, x: 0, y: 2280 }
    - { ref: get_task, x: 0, y: 2400 }
    - { ref: list_tasks, x: 0, y: 2520 }
    - { ref: upd_task, x: 0, y: 2640 }
    - { ref: del_task, x: 0, y: 2760 }
    - { ref: list_cases, x: 0, y: 2880 }
    - { ref: search_cases, x: 0, y: 3000 }
    - { ref: list_events, x: 0, y: 3120 }
    - { ref: metrics, x: 0, y: 3240 }
    - { ref: delete_case, x: 0, y: 3360 }
    - { ref: delete_ok, x: -200, y: 3480 }
    - { ref: delete_err, x: 200, y: 3480 }
    - { ref: pack_ok, x: -200, y: 3600 }
    - { ref: pack_err, x: 200, y: 3600 }
    - { ref: pack, x: 0, y: 3720 }
