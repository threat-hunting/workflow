# b17 · lvl-a · ctrl · scatter
# legacy: wf_b17aL0Scatter01
type: workflow
id: wf_b17LvlACtrlScatter
alias: b17-lvl-a-ctrl-scatter
definition:
  title: "b17 · lvl-a · ctrl · scatter"
  description: >
    P-B17 product-test artifact. Level: lvl-a (machine). Topic: T-CTRL. Role: scatter. Scatter/partition control-flow. Org: B17 Lab · Workspace: b17-ctrl. Naming: docs/15-b17-product-test/01-naming-standard.md. Legacy folder: wf_b17aL0Scatter01.
  entrypoint:
    ref: seed
  actions:
    - ref: seed
      action: core.transform.reshape
      args:
        value:
          items:
            - { id: "a", n: 1 }
            - { id: "b", n: 2 }
            - { id: "c", n: 3 }
    - ref: scatter_items
      action: core.transform.scatter
      depends_on: [seed]
      args:
        collection: ${{ ACTIONS.seed.result.items }}
        interval: 0
    - ref: per_item
      action: core.transform.reshape
      depends_on: [scatter_items]
      args:
        value:
          id: ${{ ACTIONS.scatter_items.result.id }}
          doubled: ${{ ACTIONS.scatter_items.result.n }}
          tag: B17A-L0-scatter
    - ref: gather_results
      action: core.transform.gather
      depends_on: [per_item]
      args:
        items: ${{ ACTIONS.per_item.result }}
        drop_nulls: true
        error_strategy: partition
  returns: ${{ ACTIONS.gather_results.result }}
layout:
  trigger:
    x: 0
    y: 0
  actions:
    - ref: seed
      x: 0
      y: 120
    - ref: scatter_items
      x: 0
      y: 240
    - ref: per_item
      x: 0
      y: 360
    - ref: gather_results
      x: 0
      y: 480
